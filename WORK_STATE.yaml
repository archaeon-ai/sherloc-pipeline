last_verified: 2026-09-03 — review round 8 addressed. A completed fit run no longer certifies artifacts it did not produce: before writing its `completed` marker, each domain fitter (minerals, hydration, organics) sweeps its fit directory for per-point artifacts whose point index is absent from this run's input (`_remove_obsolete_point_artifacts`, keyed on the shared `{sol}_{target}_{scan}_{region}_point{i}_...` filename form, so peak CSVs and overlay PNGs are both covered and scan-level files — summaries, averaged fits, the marker — are untouched). Per-point cleanup could only reach points the run actually processed, so a rerun over a reduced or partially re-exported point set previously left the dropped points' peak CSVs for `persist_raman_peaks()` to rediscover under a fresh completed marker. A removal that fails raises StaleArtifactError, so the marker stays `running` and persistence refuses. New tests: hydration rerun 2 points -> 1 point (artifacts gone, marker points_fitted == 1, `_discover_peak_csvs` sees only the surviving point), the same on the minerals path (region-bearing filenames), scan-level artifacts survive the sweep, an undeletable obsolete artifact blocks completion, and a direct scoping test that the sweep ignores other scans/regions and subdirectories. Suites in this worktree: unit services + core/test_hydration_veto + unit web 863 passed / 7 skipped; integration + unit core 632 passed / 206 skipped (environment-gated PDS-cache and real-ACI skips). No golden fixture churn.
