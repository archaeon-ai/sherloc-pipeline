last_verified: 2026-09-03 — review round 4 addressed. (1) persist_raman_peaks() now requires the domain's completed-run marker whether or not peak CSVs are present: the marker is cleared at fit start, so leftover or partial CSVs from an interrupted rerun no longer bypass the check and replace the database with an incomplete result. The marker's domain field must also match. (2) A marker reporting points_fitted <= 0 is rejected before any database replacement, and fit_hydration/fit_organics now fail on a scan with no point columns (fit_minerals already did), so an empty run can never write a zero-point marker that clears valid rows. _read_fit_run_marker() treats a marker missing points_fitted as absent. New tests: interrupted rerun with a surviving CSV (all three domains), zero-point marker rejection (hydration + organics, with and without CSVs), wrong-domain marker, marker missing points_fitted, and fit-level zero-point-column guards for hydration and organics. Existing hand-built fit-directory fixtures now write markers, as a real fit does. Breaking for operators: fit directories predating run markers must be re-fitted before persist-peaks accepts them (CHANGELOG updated); the bulk backfill paths report such scans as per-scan errors and skip them rather than clearing rows. Suites in this worktree (MPLBACKEND=Agg; the default Tk backend is unusable in this shell and errors unrelated tests): unit services + hydration veto 496 passed / 6 skipped; integration service-pipeline 29 passed; regression golden 7 passed / 2 failed — the same pre-existing test_review_decisions_match[ml|modz] amplitude rtol 1e-4 drift that fails identically on clean branch head 19a3124. No golden fixture churn.
