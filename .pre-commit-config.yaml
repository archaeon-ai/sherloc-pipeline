default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: fixture-provenance
        name: Fixture-provenance ledger check (data files)
        entry: scripts/check-fixture-provenance.py --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: public-wording-commit-msg
        name: Public wording check (commit message)
        entry: scripts/check-public-wording.py --commit-msg
        language: system
        stages: [commit-msg]
